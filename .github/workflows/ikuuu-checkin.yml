name: IKUUU 自动签到

on:
  schedule:
    # 每天北京时间 9:00 执行（UTC 1:00）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'  # 缓存 pip 依赖

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Reason: 免费浏览器过 Geetest，需要 Chromium
        python -m playwright install --with-deps chromium

    - name: 验证依赖安装
      run: |
        echo "📦 已安装的包版本："
        pip list | grep -E "requests|beautifulsoup4|brotli|urllib3|playwright"

    - name: 执行签到
      env:
        # 推荐：仅邮箱+密码，Playwright 免费点击 Geetest，无需打码
        IKUUU_EMAIL: ${{ secrets.IKUUU_EMAIL }}
        IKUUU_PASSWORD: ${{ secrets.IKUUU_PASSWORD }}
        # 可选备用：打码平台 / 手工 Cookie / 强制域名
        CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        YESCAPTCHA_API_KEY: ${{ secrets.YESCAPTCHA_API_KEY }}
        CAPTCHA_PROVIDER: ${{ secrets.CAPTCHA_PROVIDER }}
        IKUUU_DOMAIN: ${{ secrets.IKUUU_DOMAIN }}
        IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
        IKUUU_USE_BROWSER_LOGIN: ${{ secrets.IKUUU_USE_BROWSER_LOGIN }}
      run: |
        echo "🚀 开始执行 IKUUU 自动签到..."
        python main.py

    - name: 更新域名缓存
      if: success()
      run: |
        if git diff --quiet domain.txt 2>/dev/null && ! git ls-files --others --exclude-standard | grep -q "^domain.txt$"; then
          echo "ℹ️ 域名缓存无变化，跳过提交"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add domain.txt
          git commit -m "自动更新域名缓存" || echo "ℹ️ 无需提交"
          git push || echo "⚠️ 推送失败，域名缓存将在下次运行时重新生成"
        fi

    - name: 签到结果通知
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ 签到成功！"
        else
          echo "❌ 签到失败，请查看日志"
          exit 1
        fi
